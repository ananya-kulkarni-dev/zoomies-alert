<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E4373F">
  <title>Zoomies | Late order checker</title>
  <style>
    :root {
      color-scheme: light;
      --red: #E4373F;
      --ink: #303238;
      --muted: #73757c;
      --line: #e7e7e9;
      --surface: #fff;
      --wash: #f7f7f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--wash);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { background: var(--red); color: white; }
    .topbar, main { width: min(100% - 40px, 960px); margin: 0 auto; }
    .topbar { min-height: 82px; display: flex; align-items: center; }
    .logo { display: block; width: 150px; height: auto; }
    main { padding: 48px 0 64px; }
    .eyebrow { color: var(--red); font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; font-size: clamp(2rem, 5vw, 2.65rem); letter-spacing: -.04em; line-height: 1.15; }
    .intro { margin: 0; max-width: 620px; color: var(--muted); }
    .panel { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px #20222a0a; }
    .controls { display: flex; align-items: end; gap: 16px; padding: 22px 24px; border-bottom: 1px solid var(--line); }
    label { display: block; margin-bottom: 7px; font-size: .88rem; font-weight: 700; }
    input {
      width: 220px; min-height: 44px; padding: 9px 12px; border: 1px solid #c9cacf; border-radius: 7px;
      color: var(--ink); font: inherit; background: white;
    }
    input:focus { outline: 3px solid #e4373f33; border-color: var(--red); }
    .hint { padding-bottom: 10px; color: var(--muted); font-size: .84rem; }
    .summary { padding: 22px 24px 8px; font-size: .95rem; font-weight: 700; }
    .list { padding: 0 24px 24px; }
    .order { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .order:last-child { border-bottom: 0; }
    .order-id { color: var(--red); font-weight: 800; }
    .restaurant { font-weight: 700; }
    .detail { color: var(--muted); font-size: .88rem; }
    .badge { padding: 5px 9px; border-radius: 999px; background: #fff0f0; color: #b9222b; font-size: .78rem; font-weight: 750; white-space: nowrap; }
    .empty, .error { padding: 18px 0; color: var(--muted); }
    .error { color: #a31d25; }
    @media (max-width: 560px) {
      .topbar, main { width: min(100% - 28px, 960px); }
      main { padding-top: 34px; }
      .controls { align-items: stretch; flex-direction: column; gap: 8px; padding: 18px; }
      input { width: 100%; }
      .hint { padding: 0; }
      .summary { padding: 20px 18px 8px; }
      .list { padding: 0 18px 18px; }
      .order { grid-template-columns: 1fr auto; gap: 4px 10px; }
      .order-id { grid-column: 1; }
      .badge { grid-column: 2; grid-row: 1 / span 2; }
      .order-info { grid-column: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar"><img class="logo" src="zoomies-logo.svg" alt="Zoomies"></div>
  </header>
  <main>
    <div class="eyebrow">Meera’s team</div>
    <h1>Late order checker</h1>
    <p class="intro">Choose a time on 16 October 2026 to see which orders were past their promise time and still undelivered.</p>

    <section class="panel" aria-label="Late order results">
      <div class="controls">
        <div>
          <label for="check-time">Check time · 16 October 2026</label>
          <input id="check-time" type="time" step="60" value="16:10" aria-describedby="time-hint">
        </div>
        <div class="hint" id="time-hint">Times are shown in the browser’s local time zone.</div>
      </div>
      <div class="summary" id="summary" aria-live="polite">Loading orders…</div>
      <div class="list" id="orders-list" aria-live="polite"></div>
    </section>
  </main>

  <script>
    "use strict";
    const DATE = "2026-10-16";
    const timeInput = document.getElementById("check-time");
    const summary = document.getElementById("summary");
    const list = document.getElementById("orders-list");
    let orders = [];

    // Parse the small, unquoted CSV format used by orders.csv, including a UTF-8 BOM if present.
    function parseCSV(text) {
      const rows = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
      if (rows.length < 2) return [];
      const headers = rows.shift().split(",").map(value => value.trim());
      return rows.filter(Boolean).map(row => {
        const values = row.split(",");
        return Object.fromEntries(headers.map((header, index) => [header, (values[index] || "").trim()]));
      });
    }

    function render() {
      list.replaceChildren();
      if (!timeInput.value) {
        summary.textContent = "Choose a time to check orders.";
        return;
      }
      const checkAt = `${DATE} ${timeInput.value}`;
      const late = orders.filter(order => order.promised_by < checkAt && (!order.delivered_at || order.delivered_at > checkAt));
      summary.textContent = `${late.length} ${late.length === 1 ? "order is" : "orders are"} running late at ${timeInput.value}.`;
      if (late.length === 0) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = "No late orders at this time.";
        list.append(message);
        return;
      }
      for (const order of late) {
        const item = document.createElement("article");
        item.className = "order";
        const id = document.createElement("div");
        id.className = "order-id";
        id.textContent = order.order_id;
        const info = document.createElement("div");
        info.className = "order-info";
        const restaurant = document.createElement("div");
        restaurant.className = "restaurant";
        restaurant.textContent = order.restaurant;
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = `Promised by ${order.promised_by.slice(11)} · Delivery partner: ${order.delivery_partner || "Unassigned"}`;
        info.append(restaurant, detail);
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Still undelivered";
        item.append(id, info, badge);
        list.append(item);
      }
    }

    timeInput.addEventListener("input", render);
    fetch("orders.csv")
      .then(response => {
        if (!response.ok) throw new Error(`Could not load orders.csv (${response.status}).`);
        return response.text();
      })
      .then(text => {
        orders = parseCSV(text).filter(order => order.promised_by.startsWith(`${DATE} `));
        render();
      })
      .catch(error => {
        summary.textContent = "Orders could not be loaded.";
        const message = document.createElement("div");
        message.className = "error";
        message.textContent = `${error.message} Open this page through GitHub Pages or a local web server so it can fetch the CSV.`;
        list.replaceChildren(message);
      });
  </script>
</body>
</html>
